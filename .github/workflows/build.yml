name: Build BazaarYar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # Java 17
      # =====================================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =====================================================
      # Python
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =====================================================
      # System dependencies
      # =====================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # =====================================================
      # Python dependencies
      # =====================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.6.0
          pip install cython==0.29.36


      # =====================================================
      # Build APK
      # =====================================================

      - name: Build APK
        run: |
          buildozer android debug


      # =====================================================
      # Upload APK
      # =====================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BazaarYar-APK
          path: bin/*.apk


      # =====================================================
      # Upload build log
      # =====================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BazaarYar-Build-Log
          path: |
            .buildozer/android/platform/python-for-android/
            .buildozer/
          if-no-files-found: ignore
